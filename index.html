<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madlen Fabrica — Прайс-лист</title>
    <style>
        :root {
            --primary-red: #e30613;     /* Ярко-красный Madlen */
            --yellow-accent: #ffed00;  /* Желтая волна / акценты */
            --whatsapp-green: #25d366;
            --dark-text: #1a1a1a;
            --bg-color: #f9f9f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--dark-text); padding-bottom: 110px; }
        
        /* Шапка в стиле Madlen Fabrica */
        header { 
            background-color: var(--primary-red); 
            color: white; 
            padding: 20px 15px 25px 15px; 
            text-align: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .logo-text {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: none;
            margin-bottom: 2px;
            font-family: 'Georgia', serif;
        }
        .sub-logo {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 12px;
            opacity: 0.95;
        }
        
        /* Желтая декоративная полоса/волна */
        .wave-line {
            height: 5px;
            background: var(--yellow-accent);
            border-radius: 3px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 15px auto;
        }

        .search-box { 
            width: 100%; 
            max-width: 500px; 
            padding: 11px 15px; 
            border: 2px solid white; 
            border-radius: 8px; 
            font-size: 0.95rem; 
            outline: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .search-box:focus {
            border-color: var(--yellow-accent);
        }

        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

        /* Блок данных клиента */
        .client-info-card {
            background: white;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            border-left: 5px solid var(--primary-red);
        }
        .client-info-card h3 {
            font-size: 1rem;
            color: var(--primary-red);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .input-group:last-child {
            margin-bottom: 0;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #444;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: var(--primary-red);
        }
        
        /* Категории */
        .category { 
            background: white; 
            margin-bottom: 12px; 
            border-radius: 10px; 
            overflow: hidden; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            border: 1px solid #eee;
        }
        .category-title { 
            background: #fff8f8; 
            color: var(--primary-red); 
            padding: 14px 16px; 
            font-weight: 700; 
            font-size: 1.05rem;
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            user-select: none; 
            border-left: 5px solid var(--primary-red);
        }
        .category-title::after { 
            content: '▼'; 
            font-size: 0.75rem; 
            transition: transform 0.3s; 
            color: var(--primary-red); 
        }
        .category.open .category-title::after { transform: rotate(180deg); }
        .products-list { display: none; padding: 5px 0; }
        .category.open .products-list { display: block; }
        
        /* Карточка товара */
        .product-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 16px; 
            border-bottom: 1px solid #f2f2f2; 
        }
        .product-item:last-child { border-bottom: none; }
        .product-info { flex: 1; padding-right: 10px; }
        .product-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; color: #222; }
        .product-price { font-size: 0.95rem; color: var(--primary-red); font-weight: 800; }
        
        /* Счетчик */
        .counter { 
            display: flex; 
            align-items: center; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            overflow: hidden; 
            background: #fff;
        }
        .counter button { 
            background: #f8f8f8; 
            border: none; 
            width: 32px; 
            height: 32px; 
            font-size: 1.2rem; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.2s; 
            color: var(--primary-red); 
        }
        .counter button:hover { background: var(--yellow-accent); color: #000; }
        .counter input { 
            width: 42px; 
            height: 32px; 
            text-align: center; 
            border: none; 
            border-left: 1px solid #ddd; 
            border-right: 1px solid #ddd; 
            font-size: 0.95rem; 
            font-weight: bold; 
            color: #111;
        }
        
        /* Нижняя панель */
        .footer-panel { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: white; 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1); 
            z-index: 100; 
            border-top: 3px solid var(--primary-red); 
        }
        .total-box { font-size: 1.05rem; font-weight: bold; color: #333; }
        .total-box span { color: var(--primary-red); font-size: 1.2rem; font-weight: 800; }
        .order-btn { 
            background-color: var(--whatsapp-green); 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            font-size: 0.95rem; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            transition: transform 0.2s, background-color 0.2s; 
            box-shadow: 0 2px 6px rgba(37,211,102,0.3);
        }
        .order-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

<header>
    <div class="logo-text">Madlen</div>
    <div class="sub-logo">Fabrica</div>
    <div class="wave-line"></div>
    <input type="text" id="search" class="search-box" placeholder="Поиск товара или группы...">
</header>

<div class="container">
    <!-- Блок ввода данных клиента -->
    <div class="client-info-card">
        <h3>Информация о заказчике</h3>
        <div class="input-group">
            <label for="client-ip">ИП:</label>
            <input type="text" id="client-ip" placeholder="Введите наименование ИП">
        </div>
        <div class="input-group">
            <label for="client-address">Адрес доставки / название магазина:</label>
            <input type="text" id="client-address" placeholder="Улица, дом, название магазина">
        </div>
    </div>

    <!-- Каталог товаров -->
    <div id="catalog"></div>
</div>

<div class="footer-panel">
    <div class="total-box">ИТОГО: <span id="total-sum">0</span> ₸</div>
    <button class="order-btn" onclick="sendOrder()">Отправить заказ</button>
</div>

<script>
// Прайс-лист
const catalogData = [
  {
    category: "Сахарное печенье",
    items: [
      { name: "Печенье К Чаю Восточное Коробка 4кг.", price: 4995 },
      { name: "Печенье К Чаю Восточное Пакет 0,5кг.", price: 755 },
      { name: "Печенье К Чаю Шоколадное Коробка 4кг.", price: 6370 },
      { name: "Печенье К Чаю Шоколадное Пакет 0,5кг.", price: 855 },
      { name: "Печенье Любимое с белым шоколадом Коробка 0,46 кг.", price: 1190 },
      { name: "Печенье Любимое с темным шоколадом Коробка 0,46 кг.", price: 1190 },
      { name: "Печенье Артемон Коробка 1,5 кг.", price: 3210 }
    ]
  },
  {
    category: "Песочное печенье",
    items: [
      { name: "Печенье К Чаю Домашнее Коробка 5,5кг.", price: 5905 },
      { name: "Печенье К Чаю Домашнее Пакет 0,5 кг.", price: 795 },
      { name: "Печенье Овсяное Коробка 3кг.", price: 3690 }
    ]
  },
  {
    category: "Затяжное печенье",
    items: [
      { name: "Печенье Madlen Коробка 3 кг.", price: 3445 },
      { name: "Печенье Madlen Пакет 0,5 кг.", price: 710 }
    ]
  },
  {
    category: "Печенье крекер",
    items: [
      { name: "Печенье Крекер сырный Коррекс 0,75 кг.", price: 1415 }
    ]
  },
  {
    category: "Воздушный десерт ZIFFY",
    items: [
      { name: "Печенье Ziffy клубничный Коробка 0,31 кг.", price: 1140 },
      { name: "Печенье Ziffy с кокосом Коробка 0,31 кг.", price: 1140 },
      { name: "Печенье Ziffy шоколадный с кокосом Коробка 0,38 кг.", price: 1335 },
      { name: "Печенье Ziffy Коробка 0,35 кг.", price: 1255 }
    ]
  },
  {
    category: "Печенье сэндвич",
    items: [
      { name: "Печенье Choco Loco Коробка 12 шт. (0,360 кг.)", price: 1295 },
      { name: "Печенье Choco Loco Коробка 8 шт. (0,240 кг.)", price: 920 },
      { name: "Печенье Choco Loco Шоу бокс 22 шт. по 0,66 кг.", price: 2220 }
    ]
  },
  {
    category: "Мультизлаковые конфеты",
    items: [
      { name: "Конфеты мультизлаковые АССОРТИ Упаковка 0,4 кг.", price: 1370 },
      { name: "Конфеты мультизлаковые с белой глазурью (фасовка 0,4кг) (Ж)", price: 1370 },
      { name: "Конфеты мультизлаковые с белой глазурью и воздушным рисом (фасовка 0,4кг) (З)", price: 1370 },
      { name: "Конфеты мультизлаковые с темной глазурью (фасовка 0,4кг) (С)", price: 1370 },
      { name: "Конфеты мультизлаковые с темной глазурью и воздушным рисом (фасовка 0,4кг) (К)", price: 1370 }
    ]
  },
  {
    category: "Чак-чак",
    items: [
      { name: "Чак-Чак Медовый Коробка 0,150кг", price: 635 }
    ]
  }
];

// Рендер каталога
function renderCatalog() {
    const catalogContainer = document.getElementById('catalog');
    catalogContainer.innerHTML = '';

    catalogData.forEach((cat, catIdx) => {
        const catDiv = document.createElement('div');
        catDiv.className = 'category';
        
        let itemsHTML = '';
        cat.items.forEach((item, itemIdx) => {
            const inputId = `item-${catIdx}-${itemIdx}`;
            itemsHTML += `
                <div class="product-item">
                    <div class="product-info">
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">${item.price} ₸</div>
                    </div>
                    <div class="counter">
                        <button onclick="changeQty('${inputId}', -1)">-</button>
                        <input type="number" id="${inputId}" value="0" min="0" data-price="${item.price}" onchange="recalcTotal()">
                        <button onclick="changeQty('${inputId}', 1)">+</button>
                    </div>
                </div>
            `;
        });

        catDiv.innerHTML = `
            <div class="category-title" onclick="toggleCategory(this)">${cat.category}</div>
            <div class="products-list">${itemsHTML}</div>
        `;
        catalogContainer.appendChild(catDiv);
    });
}

function toggleCategory(el) {
    el.parentElement.classList.toggle('open');
}

function changeQty(id, delta) {
    const input = document.getElementById(id);
    let val = parseInt(input.value) || 0;
    val = Math.max(0, val + delta);
    input.value = val;
    recalcTotal();
}

function recalcTotal() {
    let total = 0;
    document.querySelectorAll('.counter input').forEach(input => {
        const qty = parseInt(input.value) || 0;
        const price = parseFloat(input.getAttribute('data-price')) || 0;
        total += qty * price;
    });
    document.getElementById('total-sum').innerText = total.toLocaleString('ru-RU');
}

// Поиск
document.getElementById('search').addEventListener('input', function(e) {
    const text = e.target.value.toLowerCase().trim();
    document.querySelectorAll('.category').forEach(cat => {
        let hasVisible = false;
        cat.querySelectorAll('.product-item').forEach(item => {
            const name = item.querySelector('.product-name').innerText.toLowerCase();
            if (name.includes(text)) {
                item.style.display = 'flex';
                hasVisible = true;
            } else {
                item.style.display = 'none';
            }
        });
        if (text !== '') {
            if (hasVisible) {
                cat.style.display = 'block';
                cat.classList.add('open');
            } else {
                cat.style.display = 'none';
            }
        } else {
            cat.style.display = 'block';
            cat.classList.remove('open');
            cat.querySelectorAll('.product-item').forEach(item => item.style.display = 'flex');
        }
    });
});

// Отправка заказа в WhatsApp
function sendOrder() {
    const ipVal = document.getElementById('client-ip').value.trim();
    const addressVal = document.getElementById('client-address').value.trim();

    if (!ipVal) {
        alert("Пожалуйста, укажите ИП!");
        document.getElementById('client-ip').focus();
        return;
    }

    if (!addressVal) {
        alert("Пожалуйста, укажите адрес доставки / название магазина!");
        document.getElementById('client-address').focus();
        return;
    }

    let message = "НОВЫЙ ЗАКАЗ (Madlen Fabrica)\n\n";
    message += `ИП: ${ipVal}\n`;
    message += `Адрес / Магазин: ${addressVal}\n\n`;
    message += "СОСТАВ ЗАКАЗА:\n";

    let hasItems = false;
    let total = 0;

    document.querySelectorAll('.product-item').forEach(item => {
        const input = item.querySelector('.counter input');
        const qty = parseInt(input.value) || 0;
        if (qty > 0) {
            hasItems = true;
            const name = item.querySelector('.product-name').innerText.trim();
            const price = parseFloat(input.getAttribute('data-price')) || 0;
            const sum = qty * price;
            total += sum;
            message += `• ${name}\n   ${qty} шт x ${price} ₸ = ${sum} ₸\n`;
        }
    });

    if (!hasItems) {
        alert("Выберите хотя бы один товар!");
        return;
    }

    message += `\nИТОГО: ${total.toLocaleString('ru-RU')} ₸`;

    const encodedMsg = encodeURIComponent(message);
    window.open(`https://wa.me/?text=${encodedMsg}`, '_blank');
}

renderCatalog();
</script>

</body>
</html>
